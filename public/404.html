<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#080806" />
  <title>404 — Page not found | Kuber Bassi</title>

  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* ── Reset & Base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      color-scheme: dark;
      --bg:             #090908;
      --surface:        #111110;
      --border:         rgba(255,255,255,0.09);
      --border-gold:    rgba(213,178,126,0.28);
      --text-primary:   #f5f3ef;
      --text-secondary: #b4afa7;
      --text-muted:     #5a5650;
      --accent:         #d5b27e;
      --accent-light:   #e8d5b5;
      --accent-dark:    #b5935f;
      --accent-glow:    rgba(213,178,126,0.22);
      --font:           'Plus Jakarta Sans', system-ui, sans-serif;
      --ease-spring:    cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-out:       cubic-bezier(0, 0, 0.2, 1);
    }

    html, body {
      min-height: 100svh;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text-primary);
      overflow-x: hidden;
    }

    /* ── Dot-matrix canvas background ───────────────────────── */
    body {
      display: grid;
      place-items: center;
      padding: 2rem;
      position: relative;
    }

    /* Subtle topographic-style radial dot field */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(213,178,126,0.18) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: radial-gradient(
        ellipse 80% 70% at 50% 50%,
        black 0%, transparent 100%
      );
      -webkit-mask-image: radial-gradient(
        ellipse 80% 70% at 50% 50%,
        black 0%, transparent 100%
      );
      pointer-events: none;
      z-index: 0;
      animation: dot-pulse 8s ease-in-out infinite;
    }

    /* Warm glow behind center */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(
        ellipse 60% 55% at 50% 50%,
        rgba(213,178,126,0.06) 0%,
        transparent 70%
      );
      pointer-events: none;
      z-index: 0;
    }

    @keyframes dot-pulse {
      0%, 100% { opacity: 0.55; }
      50%       { opacity: 0.85; }
    }

    /* ── Page wrapper ────────────────────────────────────────── */
    .page-404 {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0;
    }

    /* ── Dot-matrix 404 art ──────────────────────────────────── */
    .dot-art {
      position: relative;
      width: 100%;
      margin-bottom: 2.5rem;
    }

    /* SVG art container */
    .dot-svg {
      width: 100%;
      max-width: 560px;
      height: auto;
      display: block;
      margin: 0 auto;
      overflow: visible;
    }

    /* Individual dot glow animation */
    .dot-lit {
      fill: var(--accent);
      filter: drop-shadow(0 0 4px rgba(213,178,126,0.8));
      animation: dot-flicker var(--d, 3s) ease-in-out infinite var(--delay, 0s);
    }

    .dot-dim {
      fill: rgba(213,178,126,0.12);
    }

    @keyframes dot-flicker {
      0%, 100% { opacity: 1;    filter: drop-shadow(0 0 4px rgba(213,178,126,0.8)); }
      45%      { opacity: 0.6;  filter: drop-shadow(0 0 2px rgba(213,178,126,0.4)); }
      50%      { opacity: 0.35; filter: drop-shadow(0 0 0px rgba(213,178,126,0)); }
      55%      { opacity: 0.6;  filter: drop-shadow(0 0 2px rgba(213,178,126,0.4)); }
    }

    /* Scanline overlay on the art */
    .dot-art::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0,0,0,0.04) 3px,
        rgba(0,0,0,0.04) 4px
      );
      pointer-events: none;
    }

    /* ── Text content ────────────────────────────────────────── */
    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .eyebrow {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0.75;
    }

    h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      color: var(--text-primary);
      line-height: 1.15;
    }

    p {
      font-size: 1rem;
      line-height: 1.7;
      color: var(--text-secondary);
      max-width: 380px;
    }

    /* ── Action row ──────────────────────────────────────────── */
    .actions {
      display: flex;
      align-items: center;
      gap: 0.875rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 0.5rem;
    }

    /* Primary button — matches site's SpecularButton gold style */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.8rem 1.4rem;
      background: var(--accent);
      color: #080807;
      font-family: var(--font);
      font-size: 0.8125rem;
      font-weight: 700;
      text-decoration: none;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition:
        background 180ms ease,
        transform 240ms cubic-bezier(0.2,0.8,0.2,1),
        box-shadow 240ms ease;
      box-shadow:
        0 0 0 1px rgba(213,178,126,0.3),
        0 4px 16px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.25);
    }

    .btn-primary:hover {
      background: var(--accent-light);
      transform: translateY(-2px);
      box-shadow:
        0 0 0 1px rgba(213,178,126,0.5),
        0 8px 24px rgba(213,178,126,0.2),
        inset 0 1px 0 rgba(255,255,255,0.35);
    }

    .btn-primary:active { transform: translateY(0); }
    .btn-primary:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    /* Ghost / secondary button */
    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.8rem 1.4rem;
      background: transparent;
      color: var(--text-secondary);
      font-family: var(--font);
      font-size: 0.8125rem;
      font-weight: 500;
      text-decoration: none;
      border-radius: 12px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition:
        color 180ms ease,
        border-color 180ms ease,
        transform 240ms cubic-bezier(0.2,0.8,0.2,1),
        box-shadow 240ms ease;
    }

    .btn-ghost:hover {
      color: var(--text-primary);
      border-color: var(--border-gold);
      transform: translateY(-2px);
      box-shadow:
        0 0 0 1px rgba(213,178,126,0.15),
        0 4px 16px rgba(0,0,0,0.3);
    }

    .btn-ghost:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    /* Arrow icon inside button */
    .btn-icon {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* ── Divider ─────────────────────────────────────────────── */
    .divider {
      width: 1px;
      height: 14px;
      background: var(--border);
    }

    /* ── Footer brand ────────────────────────────────────────── */
    .brand-footer {
      margin-top: 4rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      opacity: 0.35;
      transition: opacity 300ms ease;
    }

    .brand-footer:hover { opacity: 0.6; }

    .brand-footer a {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    .brand-logo {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 1px solid rgba(213,178,126,0.18);
      background: rgba(255,255,255,0.03);
      padding: 2px;
    }

    /* ── Entry animation ─────────────────────────────────────── */
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .dot-art   { animation: fade-up 0.7s var(--ease-out) 0.05s both; }
    .eyebrow   { animation: fade-up 0.6s var(--ease-out) 0.25s both; }
    h1         { animation: fade-up 0.6s var(--ease-out) 0.35s both; }
    p          { animation: fade-up 0.6s var(--ease-out) 0.45s both; }
    .actions   { animation: fade-up 0.6s var(--ease-out) 0.55s both; }
    .brand-footer { animation: fade-up 0.6s var(--ease-out) 0.7s both; }

    /* ── Responsive ──────────────────────────────────────────── */
    @media (max-width: 480px) {
      body { padding: 1.5rem 1.25rem; }
      .dot-svg { max-width: 340px; }
      h1 { font-size: 1.5rem; }
      .actions { flex-direction: column; width: 100%; }
      .btn-primary, .btn-ghost { width: 100%; justify-content: center; }
      .divider { display: none; }
    }
  </style>
</head>
