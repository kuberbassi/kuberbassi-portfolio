<!doctype html>
<html lang="en-IN">
<head>

  <title>Page not found | Kuber Bassi</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", system-ui, sans-serif; }

    main { width: min(90%, 42rem); padding: 3rem; border: 1px solid rgba(213,178,126,.3); border-radius: 1.5rem; background: #11110f; }
    p { color: #b4afa7; font-size: 1.1rem; line-height: 1.6; }
    a { display: inline-block; margin-top: 1rem; padding: .9rem 1.25rem; color: #080806; background: #d5b27e; border-radius: .75rem; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid #f5f3ef; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Page not found.</h1>
